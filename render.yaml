services:
  - type: web
    name: leadhunter-searxng
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: SEARXNG_SECRET
        generateValue: true
      - key: SEARXNG_PORT
        value: "8080"
      - key: SEARXNG_BIND_ADDRESS
        value: "0.0.0.0"
      - key: SEARXNG_LIMITER
        value: "false"
      - key: SEARXNG_PUBLIC_INSTANCE
        value: "false"
      - key: SEARX_AUTH_USER
        value: leadhunter
      - key: SEARX_AUTH_PASSWORD
        generateValue: true
