services:
  - type: web
    name: leadhunter-searxng
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: SEARXNG_SECRET
        generateValue: true
      - key: SEARX_AUTH_USER
        value: leadhunter
      - key: SEARX_AUTH_PASSWORD
        generateValue: true
