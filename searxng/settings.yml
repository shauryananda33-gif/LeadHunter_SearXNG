use_default_settings: true

general:
  debug: false
  instance_name: "LeadHunter Search"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "LEADHUNTER_SEARX_SECRET"
  limiter: false
  image_proxy: false
  public_instance: false

ui:
  static_use_hash: true

# Start with several engines. SearXNG can fall back when an individual
# upstream engine is unavailable or rate-limited.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false
